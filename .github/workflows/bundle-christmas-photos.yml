name: Bundle real Christmas photographs
on:
  push:
    paths:
      - '.github/workflows/bundle-christmas-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate photographs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          python3 - <<'PY'
          import urllib.request, os, sys
          photos = {
            "natal-hero.jpg": [
              "https://images.pexels.com/photos/1303081/pexels-photo-1303081.jpeg?auto=compress&cs=tinysrgb&w=1200",
              "https://images.unsplash.com/photo-1512389142860-9c449e58a543?w=1200&q=85"
            ],
            "natal-vitrine.jpg": [
              "https://images.pexels.com/photos/6181838/pexels-photo-6181838.jpeg?auto=compress&cs=tinysrgb&w=1200",
              "https://images.unsplash.com/photo-1543589077-47d81606c1bf?w=1200&q=85"
            ],
            "natal-faq.jpg": [
              "https://images.pexels.com/photos/1303082/pexels-photo-1303082.jpeg?auto=compress&cs=tinysrgb&w=1200",
              "https://images.unsplash.com/photo-1482517967863-00e15c9b44be?w=1200&q=85"
            ],
          }
          for name, urls in photos.items():
            for url in urls:
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                with urllib.request.urlopen(req, timeout=25) as response: data=response.read()
                if len(data)<10000 or not data.startswith(bytes.fromhex("ffd8ff")): raise ValueError("not a JPEG")
                open("public/images/"+name,"wb").write(data)
                print("Saved",name,len(data),"bytes")
                break
              except Exception as e: print("Retry",name,str(e))
            else: sys.exit("Could not download "+name)
          PY
      - name: Activate locally hosted photos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/page.jsx")
          s=p.read_text()
          s=s.replace('src="https://images.pexels.com/photos/6181838/pexels-photo-6181838.jpeg?auto=compress&cs=tinysrgb&w=1100"', 'src="/images/natal-hero.jpg"')
          s=s.replace('src="https://images.pexels.com/photos/29637478/pexels-photo-29637478.jpeg?auto=compress&cs=tinysrgb&w=900"', 'src="/images/natal-vitrine.jpg"')
          s=s.replace('src="https://images.pexels.com/photos/35002552/pexels-photo-35002552.jpeg?auto=compress&cs=tinysrgb&w=1100"', 'src="/images/natal-faq.jpg"')
          p.write_text(s)
          css=Path("app/globals.css")
          style=css.read_text().replace('https://images.pexels.com/photos/34890779/pexels-photo-34890779.jpeg?auto=compress&cs=tinysrgb&w=600','/images/natal-hero.jpg')
          css.write_text(style)
          PY
      - name: Commit photographs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/natal-hero.jpg public/images/natal-vitrine.jpg public/images/natal-faq.jpg app/page.jsx app/globals.css
          git diff --cached --quiet || (git commit -m "assets: bundle real Christmas photographs locally" && git push)
